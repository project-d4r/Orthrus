[build-system]
requires = ["setuptools>=36.2", "cython>=3.0", "numpy"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "orthrus"
version = "0.1.0"
description = "Orthrus is a mature RNA model for RNA property prediction."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy", "pandas"]
dynamic = ["readme", "authors", "classifiers", "keywords", "entry-points", "optional-dependencies"]

